name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit tests (brute force)
        working-directory: server
        run: mvn -B -ntp verify

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm run build

  verify:
    name: End-to-end verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the server
        working-directory: server
        run: mvn -B -ntp -DskipTests package
      - name: Start the server
        run: |
          java -jar server/target/wheellab-server.jar --port 8090 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8090/api/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: MatchX
        run: python3 tools/verify/verify_matchx.py --url http://localhost:8090
      - name: LOTTO, KENO and My Games
        run: python3 tools/verify/verify_pick.py --url http://localhost:8090
      - name: Server log
        if: failure()
        run: cat server.log
